<!-- ===== BANER ZA OGLASNIK (zalepi u index.html) =====
     Gde: u <body>, na mesto gde želiš da se vidi (npr. posle sekcije sa nišama, pre footer-a).
     Sve (stil + skripta) je u ovom bloku, ne treba ništa drugo da menjaš. -->
<style>
.lpo-baner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;max-width:1200px;margin:32px auto;padding:20px 26px;border-radius:20px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#3e2723,#5d4037);border:2px solid #c9962b;box-shadow:0 6px 20px rgba(62,39,35,.28);box-sizing:border-box;font-family:'DM Sans',sans-serif}
.lpo-baner:hover{filter:brightness(1.1)}
.lpo-i{font-size:2.4rem}
.lpo-t{flex:1;min-width:240px}
.lpo-t b{display:block;font-size:1.2rem;margin-bottom:4px}
.lpo-t small{color:#e8d9c8;font-size:.95rem;line-height:1.5}
.lpo-d{padding:12px 26px;border-radius:50px;background:linear-gradient(135deg,#f1d27a,#c9962b);color:#3b2a05;font-weight:700;white-space:nowrap}
@media(max-width:820px){.lpo-baner{margin:24px 16px}}
</style>
<a class="lpo-baner" href="oglasnik.html" data-baner="lp-u-oglasnik">
  <span class="lpo-i">📣</span>
  <span class="lpo-t"><b>Prodajete ili tražite nešto za gazdinstvo?</b><small>Oglasnik: traktori, zemljište, životinje, seme, sadnice i usluge. Postavite oglas besplatno.</small></span>
  <span class="lpo-d">Otvori oglasnik →</span>
</a>
<script>
(function () {
  var API = 'https://lokalni-backend-production.up.railway.app';
  function prijavi(id) {
    try {
      if (localStorage.getItem('lp_admin_uredjaj') === '1') return;
      var v = localStorage.getItem('lp_visitor_id');
      if (!v) { v = 'v' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('lp_visitor_id', v); }
      fetch(API + '/baner-klik', { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true, body: JSON.stringify({ baner: id, visitor_id: v }) }).catch(function () {});
    } catch (e) {}
  }
  ['click', 'auxclick'].forEach(function (t) {
    document.addEventListener(t, function (ev) {
      var a = ev.target.closest && ev.target.closest('a[data-baner]');
      if (a) prijavi(a.getAttribute('data-baner'));
    });
  });
})();
</script>
<!-- ===== KRAJ BANERA ===== -->
